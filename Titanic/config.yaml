general:
  experiment_name: scheduler4
  seed: 1
  task_type: binary
  dataset: titanic
  id_column: PassengerId
paths:
  train_csv: ./data/train.csv
  test_csv: ./data/test.csv
  output_dir: ./outputs/${general.experiment_name}
split:
  n_splits: 5
model:
  params:
    hidden_dims:
    - 64
    - 32
    dropout_rate: 0.3
training:
  device: cuda
  epochs: 50
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
dataloader:
  num_workers: 0
  pin_memory: false
