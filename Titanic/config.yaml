general:
  experiment_name: "mlp_baseline"
  seed: 42
  task_type: "binary"
paths:
  train_csv: "./data/train.csv"
  test_csv: "./data/test.csv"
  output_dir: "./outputs/${general.experiment_name}"

split:
  n_splits: 5

model:
  params:
    hidden_dims: [128, 64]
    dropout_rate: 0.2

training:
  epochs: 25
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  device: "cuda"

dataloader:
  num_workers: 2
  pin_memory: true